[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdagent"
version = "0.1.0"
description = "MD agent that finds and fixes poorly sampled side chains in a target region"
requires-python = ">=3.10"
dependencies = ["openmm>=8.1", "pdbfixer", "mdtraj", "numpy", "propka>=3.5"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mdagent = "mdagent.cli:main"

[tool.setuptools]
packages = ["mdagent"]

[tool.pytest.ini_options]
markers = ["slow: runs a short MD simulation (about one minute on CPU)"]
