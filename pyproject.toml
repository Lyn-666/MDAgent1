[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binding-lang"
version = "0.1.0"
description = "MD agent that finds and fixes poorly sampled side chains in a target region"
requires-python = ">=3.10"
dependencies = ["openmm>=8.1", "pdbfixer", "mdtraj", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
binding-lang = "binding_lang.cli:main"

[tool.setuptools]
packages = ["binding_lang"]

[tool.pytest.ini_options]
markers = ["slow: runs a short MD simulation (about one minute on CPU)"]
