# Install with: bash scripts/install.sh (it adds the CUDA version that matches the NVIDIA driver).
# OpenMM 8.3 or newer: MDAgent writes protein-only trajectories (DCDReporter atomSubset, new in 8.3).
name: mdagent
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - openmm>=8.3
  - pdbfixer
  - mdtraj
  - numpy
  - scipy
  - pydantic>=2
  - pytest
  - pip
  - pip:
      - propka>=3.5
